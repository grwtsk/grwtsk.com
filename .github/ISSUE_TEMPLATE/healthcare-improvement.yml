name: Healthcare improvement proposal
description: Propose a process or system improvement grounded in an existing report.
title: "[Healthcare improvement] "
body:
  - type: input
    id: report
    attributes:
      label: Report issue
      placeholder: "#10"
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Observed workflow limitation
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence reference
      description: Public issue reference or HTTPS document.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criterion
      description: Describe the observable outcome and evidence needed to establish it.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Public scope
      options:
        - label: I have excluded confidential information and identifying third-party details.
          required: true
