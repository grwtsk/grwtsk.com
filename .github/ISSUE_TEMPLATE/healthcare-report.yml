name: Healthcare process report
description: Track a healthcare system or process concern and its desired improvement.
title: "[Healthcare report] "
body:
  - type: textarea
    id: concern
    attributes:
      label: Public process concern
      description: Describe the process or accessibility problem, not private individuals. Distinguish firsthand experience from independently verified findings.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable change would resolve or improve the process?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Process category
      description: Select the process this report concerns. This guides unsent draft preparation, not recipient selection.
      options:
        - Accessible written communication
        - Independent review
        - Record integrity
        - Continuity of care
        - Corrective action accountability
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Initial public evidence and known gaps
      description: Public references only; keep protected originals outside GitHub.
  - type: checkboxes
    id: scope
    attributes:
      label: Public scope
      options:
        - label: I have excluded confidential information and identifying third-party details.
          required: true
