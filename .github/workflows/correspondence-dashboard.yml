name: Public correspondence dashboard
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  issues: write
concurrency:
  group: public-correspondence-dashboard
  cancel-in-progress: false
jobs:
  dashboard:
    if: github.repository == 'grwtsk/grwtsk.com' && (github.event_name != 'issue_comment' || (github.event.issue.number == 6 && github.event.comment.user.id == 176085483))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Synchronize fixed public dashboard
        env:
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://personal-correspondence-production.up.railway.app/coordination/status';
          const issue='https://api.github.com/repos/grwtsk/grwtsk.com/issues/6';
          const headers={Authorization:'Bearer '+process.env.ISSUE_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          const allowed=['received','accepted','delivered','pending','failed','bounced','complained','suppressed','delivery_delayed','sent'];
          const modes=['disabled','paused','enabled','control-unavailable'];
          let data=null;
          try{
            const r=await fetch(endpoint,{redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('unavailable');
            const d=await r.json();
            if(d.version!==1||d.policy!=='owner-requested-receipt-v1'||typeof d.ownerCase!=='boolean'||typeof d.pending!=='boolean'||!modes.includes(d.mode)||!Array.isArray(d.receipts)||d.receipts.length>40)throw Error('schema');
            if(!d.receipts.every(x=>typeof x.id==='string'&&/^[a-f0-9]{24}$/.test(x.id)&&typeof x.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.day)&&['in','out'].includes(x.direction)&&allowed.includes(x.status)))throw Error('receipt schema');
            data=d;
          }catch{}
          const lines=['Communications operations for #5. Writing review: #11. Healthcare tracking is deferred in #7 until explicitly authorized. No outbound email is authorized. Automatically maintained from a fixed-schema, owner-only projection. No raw mail, addresses, case aliases or private third-party data are published.','','## Status'];
          if(!data)lines.push('Service status unavailable. The deployment or status endpoint needs investigation. No email is sent by this workflow.');
          else {
            lines.push('- Service reachable','- Owner qualification case: '+(data.ownerCase?'present':'not yet present'),'- Routine acknowledgment policy: '+data.mode);
            lines.push(data.pending?'- **Action required:** unresolved delivery reservation; do not resend. A maintainer must reconcile provider evidence.':'- No unresolved owner-test delivery reservation.');
            if(typeof data.checkpoint==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.checkpoint))lines.push('- Local encrypted checkpoint: '+data.checkpoint+' (not off-volume backup).');
            const recovery=data.recovery;
            if(recovery&&typeof recovery.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(recovery.day)&&['verified','bounded','unavailable'].includes(recovery.intake)&&['verified','unresolved','unavailable'].includes(recovery.reconciliation))lines.push('- Read-only recovery: intake '+recovery.intake+'; pending receipt reconciliation '+recovery.reconciliation+'.');
            lines.push('','## Writing review','Use #11. Sending remains locked; no comment authorizes delivery.','','## Public owner-test receipts','','| Public receipt | UTC day | Direction | State |','|---|---|---|---|');
            for(const r of data.receipts)lines.push('| '+r.id+' | '+r.day+' | '+(r.direction==='in'?'Received':'Sent')+' | '+r.status+' |');
          }
          const body=lines.join('\n');
          const prior=await fetch(issue,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!prior.ok)throw Error('Dashboard read failed');
          if((await prior.json()).body!==body){
            const updated=await fetch(issue,{method:'PATCH',headers,body:JSON.stringify({body}),redirect:'error',signal:AbortSignal.timeout(15000)});
            if(!updated.ok)throw Error('Dashboard update failed');
          }
          NODE
