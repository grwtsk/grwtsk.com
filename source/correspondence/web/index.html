<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private correspondence</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main>
<h1>Correspondence</h1>
<p>One authorized case at a time. Messages are private. Nothing is sent by the drafting assistant.</p>
<section><h2>Operator access</h2><label for="token">Operator token</label><input id="token" type="password" autocomplete="off"><button id="connect">Open private ledger</button><button id="logout">Clear session</button><p id="status" role="status" aria-live="polite"></p></section>
<div id="workspace" hidden>
<section><h2>Open a case</h2><label for="office">Verified office or consenting correspondent</label><select id="office"></select><label for="title">Case title</label><input id="title" maxlength="150"><button id="create">Create case</button></section>
<section><h2>Case history</h2><label for="cases">Select case</label><select id="cases"></select><p id="case-info"></p><div id="history"></div><button id="refresh">Refresh</button><button id="close">Close selected case</button></section>
<section><h2>Draft</h2><label for="brief">Redacted, factual brief and specific request</label><textarea id="brief" rows="6" maxlength="4000"></textarea><label class="check"><input id="redacted" type="checkbox"> I reviewed this brief and approve sharing its non-sensitive content with the AI provider.</label><button id="generate">Generate editable draft</button><label for="subject">Subject</label><input id="subject" maxlength="160"><label for="body">Message (plain text)</label><textarea id="body" rows="10" maxlength="6000"></textarea><button id="save">Save exact draft for review</button></section>
<section><h2>Explicit approval</h2><p id="draft-status"></p><label for="reply">Reviewed reply to respond to (leave empty for initial message)</label><select id="reply"></select><label class="check"><input type="checkbox" id="approved"> I verified the recipient, evidence, content and need for this specific message.</label><button id="send">Send this reviewed message</button></section>
<section><h2>Resolve an uncertain send</h2><p>Find the matching receipt in the provider dashboard. Never resend an uncertain message.</p><label for="pending">Pending message</label><select id="pending"></select><label for="provider">Provider email ID</label><input id="provider"><button id="reconcile">Verify and record receipt</button></section>
</div>
</main></body></html>
