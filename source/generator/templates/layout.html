<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="robots" content="noindex, nofollow">
  {% if article %}<meta name="author" content="{{ article.author }}">{% endif %}
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:type" content="{{ page_type }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  {% if page_type == "article" %}
  <meta property="article:section" content="{{ article.category }}">
  {% for tag in article.tags %}<meta property="article:tag" content="{{ tag }}">{% endfor %}
  {% if article.published_at %}<meta property="article:published_time" content="{{ article.published_at }}">{% endif %}
  {% if article.modified_at %}<meta property="article:modified_time" content="{{ article.modified_at }}">{% endif %}
  {% endif %}
  <link rel="stylesheet" href="/style.css">
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TMB9CVJW" referrerpolicy="no-referrer"></script>
  <script type="application/ld+json">{{ structured | safe }}</script>
</head>
<body>
<main id="main" aria-label="Correspondence log">
{% block content %}{% endblock %}
</main>
<footer>
  <span>© 2026 R.A. Jacob Martone</span>
  <a href="https://github.com/grwtsk/math">grwtsk/math</a>
</footer>
</body>
</html>
